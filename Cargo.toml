[workspace]
resolver = "3"
# Listed one by one: a glob would also pick up the napi CLI's temporary
# `crates/.unfold-node.napi-stage-*` folders and break builds running meanwhile.
members = [
    "crates/unfold-core",
    "crates/unfold-engine",
    "crates/unfold-lang-python",
    "crates/unfold-lang-typescript",
    "crates/unfold-node",
    "crates/unfold-reader",
    "crates/unfold-store",
    "crates/unfold-workspace",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# In-repo crates.
unfold-core = { path = "crates/unfold-core" }
unfold-engine = { path = "crates/unfold-engine" }
unfold-lang-typescript = { path = "crates/unfold-lang-typescript" }
unfold-lang-python = { path = "crates/unfold-lang-python" }
unfold-store = { path = "crates/unfold-store" }
unfold-reader = { path = "crates/unfold-reader" }
unfold-workspace = { path = "crates/unfold-workspace" }

# Shared third-party crates.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1.11.0"
rayon = "1.12.0"
# File watching for background updates (the workspace's watcher thread).
notify = "8.2.0"
notify-debouncer-full = { version = "0.7.0", default-features = false, features = ["macos_fsevent"] }
# Safe `statfs` for detecting network volumes, where SQLite's write-ahead log is unsafe.
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
# SQLite compiled from source (FTS5 included) so every platform gets the same engine.
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustc-hash = "2.1.3"
# Reads Render's `render.yaml` (the import of deploy files into draft launches).
saphyr = { version = "0.1.0", default-features = false }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smallvec = { version = "1.16.2", features = ["serde", "union", "const_generics"] }
# Grows the stack for deep recursion (dropping deeply nested Python syntax trees).
stacker = "0.1.25"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "1.1.8"
# Byte spans of TOML keys and values (console-script evidence in `pyproject.toml`).
toml_parser = "1.1.5"
# Edits `unfold.toml` while preserving comments and formatting.
toml_edit = "0.25.17"
unicode-id-start = "1.5.0"
unicode-normalization = "0.1.25"
# The command table's TypeScript types (`cargo xtask gen-ipc`).
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings", "serde-json-impl"] }
# Search ranking (fuzzy scores over FTS5 candidates) and text search (ripgrep's libraries).
nucleo-matcher = "0.3.1"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# The Node-API addon (`unfold-node`) the Electron engine host loads.
napi = "3.14.2"
napi-derive = "3.6.12"
napi-build = "2.6.0"
# Opening files in the system's default app and revealing them in the file manager.
opener = { version = "0.9.0", features = ["reveal"] }
# The TypeScript parser, pinned exactly: oxc's AST changes between releases.
oxc_allocator = "=0.153.0"
oxc_ast = "=0.153.0"
oxc_ast_visit = "=0.153.0"
oxc_parser = "=0.153.0"
oxc_span = "=0.153.0"
oxc_syntax = "=0.153.0"
# Module resolution for TypeScript imports, over an in-memory view of the folder; pinned exactly.
oxc_resolver = { version = "=11.24.3", default-features = false }
# The Python parser: Ruff's internal crates, pinned to a release tag (they are not published).
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.16.10" }
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.16.10" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", tag = "0.16.10" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
uninlined_format_args = "warn"

[profile.dev.package."*"]
# Optimize dependencies (parsers, hashing, SQLite) so tests that parse real code run fast, while
# our own crates stay quick to rebuild.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
