# Every pull request and every push to main, on macOS (docs/testing.md#broad-gates).
# Actions are pinned to commit SHAs (the comment names the release).
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    name: checks
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # --- Rust ---------------------------------------------------------------------------------
      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Generated IPC types are current
        run: cargo xtask gen-ipc --check

      # Cached oracle outputs, keyed by a hash of each corpus; no Node needed
      # (testdata/reference/README.md, "Oracles").
      - name: Oracle gates (precision and recall on the in-repository corpora)
        run: cargo xtask oracles check ts-orders entrances py-orders mixed-playground python-ranges

      # --- JavaScript ---------------------------------------------------------------------------
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Unused files, exports, and dependencies
        run: pnpm knip

      - name: Unit tests (desktop, UI)
        run: pnpm -r --filter "!@unfold/node" --filter "!@unfold/e2e" test

      - name: Build the engine addon (release)
        run: pnpm --filter @unfold/node build

      - name: Addon tests
        run: pnpm --filter @unfold/node test

      - name: Third-party notices are current
        run: cargo xtask notices --check

      # --- The app ------------------------------------------------------------------------------
      - name: Build the UI and the desktop shell
        run: |
          pnpm --filter @unfold/ui build
          pnpm --filter @unfold/desktop build

      - name: Fetch the Electron binary
        run: pnpm --filter @unfold/desktop exec node -e "require('electron')"

      - name: Playwright journeys
        run: pnpm --filter ./e2e test

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
