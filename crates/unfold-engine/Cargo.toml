[package]
name = "unfold-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# TypeScript bindings for the settings edits, which travel over IPC.
ts = ["dep:ts-rs"]

[dependencies]
unfold-core = { workspace = true }
globset = { workspace = true }
ignore = { workspace = true }
postcard = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
unfold-core = { workspace = true, features = ["testkit"] }
unfold-lang-python = { workspace = true }
unfold-lang-typescript = { workspace = true }

[lints]
workspace = true
