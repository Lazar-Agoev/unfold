[package]
name = "unfold-store"
description = "Unfold's SQLite graph cache: schema, delta commits, reader queries, FTS5 name search, and the per-file facts cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Helpers for this crate's tests: row counts of every table (`Reader::stats`).
testkit = []

[dependencies]
rusqlite = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
unfold-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
unfold-core = { workspace = true, features = ["testkit"] }
# The integration tests use the `testkit` helpers.
unfold-store = { workspace = true, features = ["testkit"] }

[lints]
workspace = true
