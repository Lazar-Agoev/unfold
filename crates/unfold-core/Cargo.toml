[package]
name = "unfold-core"
description = "Unfold's graph model: nodes, links, typed records, apps and entrances, keys, validation, the canonical export, text, and paths"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Helpers for tests in this and downstream crates: the testdata location, golden files, and a
# builder for hand-written graphs.
testkit = []
# `ts_rs::TS` on the types that cross IPC (vocabularies, keys, paths), for the workspace's
# generated TypeScript types.
ts = ["dep:ts-rs"]

[dependencies]
# Files are validated in parallel.
rayon = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, optional = true }
# App and entrance names are normalized to NFC before they become slugs.
unicode-normalization = { workspace = true }

[dev-dependencies]
postcard = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
