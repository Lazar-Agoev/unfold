[package]
name = "unfold-lang-python"
description = "Unfold's Python front end: the Ruff parser adapter, lowering to nodes, binding, linking, highlighting, and census"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
unfold-core = { workspace = true }
unfold-engine = { workspace = true }
postcard = { workspace = true }
rayon = { workspace = true }
ruff_python_ast = { workspace = true }
ruff_python_parser = { workspace = true }
ruff_text_size = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
stacker = { workspace = true }
thiserror = { workspace = true }
unicode-id-start = { workspace = true }
smallvec = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
unfold-core = { workspace = true, features = ["testkit"] }
proptest = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
