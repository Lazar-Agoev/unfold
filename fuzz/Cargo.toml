[package]
name = "unfold-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "cargo-fuzz targets for Unfold's language front ends and shared backend (see README.md)"

[package.metadata]
cargo-fuzz = true

# Its own workspace: the fuzz targets need nightly and libFuzzer, so the main workspace (stable)
# excludes this folder.
[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
unfold-core = { path = "../crates/unfold-core" }
unfold-engine = { path = "../crates/unfold-engine" }
unfold-lang-python = { path = "../crates/unfold-lang-python" }
unfold-lang-typescript = { path = "../crates/unfold-lang-typescript" }

[[bin]]
name = "typescript_extract"
path = "fuzz_targets/typescript_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "python_extract"
path = "fuzz_targets/python_extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "link_resolve"
path = "fuzz_targets/link_resolve.rs"
test = false
doc = false
bench = false

[[bin]]
name = "facts_decode"
path = "fuzz_targets/facts_decode.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
