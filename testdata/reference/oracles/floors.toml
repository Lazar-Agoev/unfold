# The upstream tag lacks the generated diagnostics map, whose 2,130 `diag()` calls all resolve, so
# its recall sits below the 602-file corpus's; the floor is what Unfold reached when it was set.
# Both TypeScript source floors dropped by 12 when written values stopped being proof: two calls
# read a reassigned `let`'s initializer (`project.updateGraph`, `project.isClosed` in
# `openExternalProject`), three a property the class reassigns (`Callbacks.invoke`), and seven a
# property written through computed keys (`TestServerHost.getCurrentDirectory`, `host[prop] = …`).
[[floor]]
corpus = "typescript-6.0.3-src-upstream"
language = "typescript"
matched = 69144
resolved = 71519

[[floor]]
corpus = "typescript-6.0.3-src"
language = "typescript"
matched = 71274
resolved = 73649
poc = "96.0% (70,717 of 73,649)"

# The proof of concept measured 4,440 of 4,440 in place, with its TypeScript fork's declarations
# beside the corpus. From a copy those imports stay unresolved for both sides; the two sites
# missing here call a function-valued property of a constant object literal that also spreads
# another object, which the checker resolves and Unfold's C-2 rule leaves `unknown_receiver`.
[[floor]]
corpus = "codegraph-self"
language = "typescript"
matched = 6805
resolved = 6807
poc = "4,440 of 4,440 (in place)"
