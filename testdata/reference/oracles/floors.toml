# Recall floors, one per corpus and language (`cargo xtask oracles check`). Recall is the proof of
# concept's definition: call sites the oracle resolves (one concrete target, no policy refusal) that
# Unfold resolves to the same target, over the sites the oracle resolves. A floor records the counts
# it was set from and passes when recall is at least that ratio, compared exactly. Floors only rise:
# when the check reports recall above a floor, raise the floor to the reported counts. `poc` records
# what the proof of concept reached, for comparison; every floor below is at or above it.

[[floor]]
corpus = "ts-orders"
language = "typescript"
matched = 71
resolved = 71
poc = "46 of 71 (native producer; the 25 C-2 calls now resolve)"

[[floor]]
corpus = "entrances"
language = "typescript"
matched = 3
resolved = 3

[[floor]]
corpus = "py-orders"
language = "python"
matched = 92
resolved = 96
poc = "91 of 96"

[[floor]]
corpus = "mixed-playground"
language = "typescript"
matched = 71
resolved = 71
poc = "46 of 71"

[[floor]]
corpus = "mixed-playground"
language = "python"
matched = 92
resolved = 96
poc = "91 of 96"

[[floor]]
