# The reference corpora: which frozen PoC generation describes which testdata folder, and how its
# paths map onto that folder. `cargo xtask reference import` reads this file and writes
# `canonical/<name>.jsonl` for every corpus; `cargo xtask parity <name>` compares against it.
# Format and conversion rules: README.md in this folder.
#
# [[corpus]]
# name      Corpus name; the reference is canonical/<name>.jsonl.
# raw       The raw generation (manifest.json + five CSV files), relative to this folder.
# folder    The testdata folder Unfold opens to produce the comparable graph, relative to testdata/.
#           The importer reads every source and input from here and checks its SHA-256.
# poc_root  Where the generation was built, relative to the PoC repository root. Only used by
#           `--poc <path>`, as a fallback for files the testdata folder lacks.
# languages The languages the generation indexes.
# parity    false for a comparison aid that Unfold is not expected to reproduce (default true).
# paths     Prefix mappings from PoC paths to folder paths; the longest matching `poc` prefix wins
#           and every path must match one. Block keys follow the mapped paths.
# settings  PoC `codegraph.json` files that became the folder's `unfold.toml`, each with
#           the index of the `[[entrance]]` table that holds its first manual entrance.

[[corpus]]
name = "mixed-playground"
raw = "poc/mixed-playground"
folder = "playgrounds"
poc_root = "."
languages = ["typescript", "python"]
paths = [
  { poc = "ts-playground/", unfold = "ts-orders/" },
  { poc = "py-playground/", unfold = "py-orders/" },
]
settings = [
  { poc = "codegraph.json", first_entrance = 0 },
  { poc = "py-playground/codegraph.json", first_entrance = 5 },
]

[[corpus]]
name = "playground-ts-native"
raw = "poc/playground-ts-native"
folder = "playgrounds/ts-orders"
poc_root = "."
languages = ["typescript"]
paths = [{ poc = "ts-playground/", unfold = "" }]
settings = [{ poc = "codegraph.json", first_entrance = 0 }]

[[corpus]]
name = "playground-ts-checker"
raw = "poc/playground-ts-checker"
folder = "playgrounds/ts-orders"
poc_root = "."
languages = ["typescript"]
parity = false
paths = [{ poc = "ts-playground/", unfold = "" }]
settings = [{ poc = "codegraph.json", first_entrance = 0 }]

[[corpus]]
name = "python-playground"
raw = "poc/python-playground"
folder = "playgrounds/py-orders"
poc_root = "."
languages = ["python"]
paths = [{ poc = "py-playground/", unfold = "" }]
# The root codegraph.json holds only TypeScript entrances, so it contributes none here.
settings = [
  { poc = "codegraph.json", first_entrance = 0 },
  { poc = "py-playground/codegraph.json", first_entrance = 0 },
]

[[corpus]]
name = "entrances"
raw = "poc/entrances"
folder = "fixtures/entrances"
poc_root = "compilers/codegraph/test/fixtures/entrances"
languages = ["typescript"]
paths = [{ poc = "", unfold = "" }]
settings = [{ poc = "codegraph.json", first_entrance = 0 }]
