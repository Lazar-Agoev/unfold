# The divergence ledger: every allowed difference between a frozen PoC reference
# (canonical/<corpus>.jsonl) and what Unfold produces for that corpus's folder (precision and reference checks).
# `cargo xtask parity <corpus> --actual <file.jsonl>` fails on any difference not listed here,
# and on any entry here that no longer occurs ("stale entry"). Format: README.md in this folder.
#
# One [[divergence]] table per allowed difference. Selectors are explicit (one record, and
# optionally one field); there are no patterns.
#
#   corpus    Corpus name from corpora.toml.
#   record    file | input | block | slot | edge | entrance | target
#   key       The record's identity: the path (file, input), the structural key (block,
#             entrance), the owning block's key (slot), the source block's key (edge), or the
#             entrance key (target).
#   slot      Slot name, plus `index` for a repeated slot     (slot only)
#   seq       The edge's sequence number among its source's   (edge only)
#   position  The target's position                           (target only)
#   change    missing (only in the reference) | extra (only in Unfold's output) | changed
#   field     For `changed`: the one field this entry covers. Without it, the entry covers every
#             changed field of the record.
#   expected  Optional, with `field`: the reference value as the diff prints it ("(absent)" for
#   actual    no value). When given, the entry only matches that exact change.
#   reason    Why the difference is allowed.
#
# Example (a whole-record entry: it covers the changed target, resolution, and reason):
#
#   [[divergence]]
#   corpus = "playground-ts-native"
#   record = "edge"
#   key = "src/jobs/cleanup.ts#function:cleanupExpiredOrders/expression_statement[0]/call[0]"
#   seq = 0
#   change = "changed"
#   reason = "C-2 fixed: logger.info now resolves"
#
# A field entry adds, for example, field = "resolution", expected = "unresolved",
# actual = "resolved"; then the other changed fields need entries of their own.

# Add [[divergence]] tables below.

