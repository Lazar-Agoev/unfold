version = 1

[scope]
exclude = ["omitted.ts"]

[[entrance]]
kind = "http"
method = "POST"
trigger = "/x"
label = "Create"
handler = ["main.ts#run", "main.ts#absent", "main.ts#run"]

[[entrance]]
kind = "http"
method = "POST"
trigger = "/x"
label = "Create"
handler = ["main.ts#run", "main.ts#absent", "main.ts#run"]

[[entrance]]
kind = "worker"
handler = "omitted.ts#run"

[[entrance]]
kind = "worker"
handler = "missing.ts#run"

[[entrance]]
kind = "event"
handler = "main.ts"

[[entrance]]
kind = "process"
startup = "main.ts#run"

[[entrance]]
kind = "process"
startup = "main.ts"

[[entrance]]
kind = "process"
startup = "main.ts:1"
