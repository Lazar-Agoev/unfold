# Larger corpora, pinned rather than copied into the repository.
#
# Hash conventions used below:
#   sha256           SHA-256 of one file's bytes, or of a downloaded archive's bytes.
#   listing_sha256   SHA-256 of the corpus listing in `sha256sum` format: one line
#                    "<file sha256>  <path relative to the corpus root>\n" per selected file,
#                    sorted by path (byte order). Reproduce with
#                    `find … | LC_ALL=C sort | xargs sha256sum | sha256sum` from the corpus root.
#   poc_source_sha256  The PoC's own aggregate (compilers/codegraph/test/verify-python.ts):
#                    SHA-256 of JSON.stringify([{filePath, sha256}, …]) sorted by filePath, as
#                    locked in compilers/codegraph/test/python-recall-floor.json at 5c98a6e.
# Nothing here is downloaded by tests. A missing value is written as "" with a note saying why.
