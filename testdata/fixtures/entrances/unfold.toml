# One app per package script that starts a process, each with what it handles.

[[app]]
name = "Server"
run = "npm run start"
code = "src/server.ts#"
entrances = [
  { name = "Place an order", on = "POST /orders", code = "src/orders.ts#createOrder" },
]

[[app]]
name = "Worker"
run = "npm run worker"
code = "src/worker.ts#"
entrances = [
  { name = "Process an order", on = "queue orders", code = "src/worker.ts#processOrder" },
]
