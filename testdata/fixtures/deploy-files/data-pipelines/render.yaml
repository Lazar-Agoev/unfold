services:
  - type: worker
    name: review-poller
    env: docker
    dockerfilePath: data-pipelines/Dockerfile.workers
    dockerCommand: python3 review-workers/run_poller.py --all-businesses
    envVars:
      - key: REVIEW_POLL_INTERVAL_SECONDS
        value: "300"

  - type: worker
    name: review-worker
    env: docker
    dockerfilePath: data-pipelines/Dockerfile.workers

  - type: cron
    name: demo-sync-2-daily
    env: python
    schedule: "0 8 * * *"  # 8 AM UTC daily
    buildCommand: pip install -r data-pipelines/demo-sync-2/requirements.txt
    startCommand: python data-pipelines/demo-sync-2/sync.py

  # Rotates OAuth tokens before they expire. One schedule serves every connected
  # merchant.
  #
  # Timing policy lives in token_refresh/square.py.
  - type: cron
    name: token-refresh-daily
    env: docker
    schedule: "30 7 * * *"  # 7:30 AM UTC daily
    dockerfilePath: data-pipelines/Dockerfile.workers
    dockerCommand: python3 -m token_refresh.run

  - type: web
    name: invoice-hitl-api
    env: docker
    # Render will auto-detect Dockerfile in this folder
    healthCheckPath: /

  - type: web
    name: recipe-cost-api
    env: docker
    dockerfilePath: data-pipelines/Dockerfile.workers
    dockerCommand: python3 -m uvicorn api:app --app-dir food-cost --host 0.0.0.0 --port $PORT
