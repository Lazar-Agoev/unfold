# Unfold settings for the py-orders playground.
# Converted from the proof of concept's py-playground/codegraph.json.

# The proof of concept indexed only the 50 sources under src/. Runtime tests, the smoke
# script, and the legacy launcher stay outside the graph; legacy/ is still a source root,
# so the orders-legacy-export console script launches into an unindexed file.
[scope]
exclude = ["legacy/**", "scripts/**", "tests/**"]

[[python.project]]
root = "."
source_roots = ["src", "legacy"]

# Entrances the detectors can't see: CLI dispatch and a signal handler.
[[entrance]]
id = "import"
kind = "command"
trigger = "import"
handler = "src/orders_playground/jobs/import_orders.py#import_orders"

[[entrance]]
id = "report"
kind = "command"
trigger = "report"
handler = "src/orders_playground/cli.py#report_command"

[[entrance]]
id = "replay"
kind = "command"
trigger = "replay"
handler = "src/orders_playground/jobs/retry_failed.py#retry_failed"

[[entrance]]
id = "retry"
kind = "command"
trigger = "retry"
handler = "src/orders_playground/jobs/retry_failed.py#retry_failed"

[[entrance]]
id = "shutdown"
kind = "event"
trigger = "SIGTERM"
handler = "src/orders_playground/server.py#shutdown"
